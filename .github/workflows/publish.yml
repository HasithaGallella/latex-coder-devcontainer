# Builds the image for Intel (amd64) and Apple Silicon (arm64) and pushes it to
# ghcr.io/hasithagallella/latex-coder. Runs only when started from the Actions tab.
# It signs in with the run's own short-lived GITHUB_TOKEN; no personal token is stored.
# Actions are pinned to release commits; the comment gives the version.
name: Publish image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs the arm64 half under emulation on GitHub's Intel servers.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Dated tag
        id: date
        run: echo "tag=$(date -u +%Y.%m)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/hasithagallella/latex-coder:basic
            ghcr.io/hasithagallella/latex-coder:basic-${{ steps.date.outputs.tag }}
